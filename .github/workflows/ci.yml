name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build DSFTool from Laminar's sources
        run: python3 tools/build_dsftool.py --fetch-zlib
      - name: Lint
        working-directory: backend
        run: |
          uv sync
          uv run ruff check . ../tools
          uv run ruff format --check . ../tools
      - name: Tests
        working-directory: backend
        shell: bash
        run: |
          uv run pytest -q -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # Failed tests as annotations: readable without the full log.
          grep -E "^(FAILED|ERROR) " pytest.log | cut -c1-900 | sed 's/^/::error title=pytest::/' || true
          # No test named (pytest itself crashed): the end of the log instead.
          if [ "$status" != 0 ] && ! grep -qE "^(FAILED|ERROR) " pytest.log; then
            echo "::error title=pytest (log tail)::$(tail -n 40 pytest.log | cut -c1-200 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
          exit $status

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:frontend

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: [backend, frontend]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build DSFTool.exe (MSVC, static CRT)
        run: python tools/build_dsftool.py --fetch-zlib

      - name: Backend tests on Windows (paths, CREATE_NO_WINDOW, DSFTool.exe)
        working-directory: backend
        shell: bash
        run: |
          # Downloads fail now and then on the runners: try again before giving up.
          for attempt in 1 2 3; do
            uv sync && break
            if [ "$attempt" = 3 ]; then echo "::error title=uv sync::dependencies could not be installed"; exit 1; fi
            sleep $((attempt * 15))
          done
          uv run pytest -q -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # Failed tests as annotations: readable without the full log.
          grep -E "^(FAILED|ERROR) " pytest.log | cut -c1-900 | sed 's/^/::error title=pytest::/' || true
          # No test named (pytest itself crashed): the end of the log instead.
          if [ "$status" != 0 ] && ! grep -qE "^(FAILED|ERROR) " pytest.log; then
            echo "::error title=pytest (log tail)::$(tail -n 40 pytest.log | cut -c1-200 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
          exit $status

      - name: Package backend (PyInstaller, one folder)
        working-directory: backend
        run: uv run --group build pyinstaller packaging/xpsb-backend.spec --noconfirm --distpath build/dist --workpath build/work

      - name: Assemble app resources
        run: python tools/prepare_desktop_resources.py

      - name: Smoke test packaged backend (real build with DSFTool.exe)
        run: python tools/smoke_backend.py backend/build/dist/xpsb-backend/xpsb-backend.exe --resources-dir apps/desktop/src-tauri/resources

      - name: Desktop shell test (starts and stops the backend)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm tauri build
        env:
          VITE_BUILD_ID: ${{ github.sha }}  # shown in the settings: which build is installed

      - uses: actions/upload-artifact@v4
        with:
          name: XPSB-Setup-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
