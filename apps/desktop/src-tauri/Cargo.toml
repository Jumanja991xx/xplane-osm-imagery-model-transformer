[package]
name = "xpsb-desktop"
version = "0.1.0"
description = "X-Plane AI-Scenery Builder"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
dunce = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
